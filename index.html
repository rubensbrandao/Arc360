<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC 360</title>

<style>
:root{
  --bg:#08090b;
  --panel:#0d1013;
  --line:#22272c;
  --text:#d8dde1;
  --muted:#686f75;
  --lime:#89f336;
  --orange:#ff9d32;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,9,11,.96);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1400px;
  margin:auto;
  min-height:82px;
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
  color:var(--text);
}

.logo{
  width:48px;
  height:48px;
  image-rendering:pixelated;
  shape-rendering:crispEdges;
}

.brand-name{
  font-size:20px;
  font-weight:bold;
  letter-spacing:5px;
}

.wallet-btn{
  border:1px solid var(--lime);
  background:transparent;
  color:var(--lime);
  padding:11px 17px;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.wallet-btn:hover{
  background:var(--lime);
  color:#08090b;
}

.toolbar{
  max-width:1400px;
  margin:auto;
  padding:22px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.collection-count{
  font-size:11px;
  color:var(--muted);
  letter-spacing:2px;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

select{
  appearance:none;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  padding:10px 34px 10px 12px;
  font-size:10px;
  letter-spacing:1px;
  outline:none;
}

select:focus{
  border-color:var(--lime);
}

.search{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  padding:10px 12px;
  width:150px;
  outline:none;
  font-size:10px;
}

.search:focus{
  border-color:var(--lime);
}

.gallery-wrap{
  max-width:1400px;
  margin:auto;
  padding:0 24px 60px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:14px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:10px;
  transition:border-color .15s,transform .15s;
}

.card:hover{
  border-color:#555d63;
  transform:translateY(-2px);
}

.card-image{
  width:100%;
  aspect-ratio:1;
  display:block;
  background:#08090b;
  image-rendering:pixelated;
}

.card-info{
  padding:10px 2px 2px;
}

.card-id{
  font-size:11px;
  letter-spacing:2px;
  color:var(--text);
}

.card-price{
  margin-top:8px;
  font-size:12px;
  font-weight:bold;
}

.card-status{
  margin-top:8px;
  font-size:9px;
  letter-spacing:1.5px;
}

.available{
  color:var(--lime);
}

.minted{
  color:#777;
}

.card-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.details-btn,
.mint-btn{
  flex:1;
  border:1px solid var(--line);
  background:transparent;
  padding:8px 5px;
  font-size:8px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.details-btn{
  color:var(--text);
}

.details-btn:hover{
  border-color:#777;
}

.mint-btn{
  border-color:var(--lime);
  color:var(--lime);
}

.mint-btn:hover{
  background:var(--lime);
  color:#08090b;
}

.mint-btn:disabled{
  border-color:#333;
  color:#555;
  cursor:not-allowed;
  background:transparent;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin-top:30px;
}

.page-btn{
  width:42px;
  height:42px;
  background:transparent;
  color:var(--text);
  border:1px solid var(--line);
  font-size:18px;
}

.page-btn:hover:not(:disabled){
  border-color:var(--lime);
  color:var(--lime);
}

.page-btn:disabled{
  opacity:.25;
  cursor:not-allowed;
}

.page-number{
  font-size:10px;
  color:var(--muted);
  letter-spacing:2px;
}

/* SIDE PANEL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:40;
  display:none;
}

.overlay.open{
  display:block;
}

.side-panel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(480px,94vw);
  background:#0b0d0f;
  border-left:1px solid var(--line);
  overflow-y:auto;
  padding:24px;
}

.close{
  position:absolute;
  top:18px;
  right:18px;
  width:36px;
  height:36px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  font-size:20px;
}

.detail-image{
  width:100%;
  max-width:360px;
  display:block;
  margin:45px auto 25px;
  background:#08090b;
  image-rendering:pixelated;
}

.detail-id{
  font-size:20px;
  letter-spacing:4px;
}

.detail-price{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.detail-status{
  margin-top:10px;
  font-size:10px;
  letter-spacing:2px;
}

.traits{
  margin-top:28px;
  border-top:1px solid var(--line);
}

.trait{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font-size:10px;
}

.trait span:first-child{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
}

.trait span:last-child{
  color:var(--text);
}

.detail-mint{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:1px solid var(--lime);
  background:var(--lime);
  color:#08090b;
  font-weight:bold;
  font-size:11px;
  letter-spacing:2px;
}

.detail-mint:disabled{
  border-color:#333;
  background:#222;
  color:#777;
}

/* WALLET */

.wallet-box{
  position:fixed;
  right:24px;
  top:75px;
  z-index:50;
  width:300px;
  background:#0d1013;
  border:1px solid var(--line);
  padding:18px;
  display:none;
}

.wallet-box.open{
  display:block;
}

.wallet-title{
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:12px;
}

.wallet-address{
  font-family:monospace;
  font-size:10px;
  color:var(--muted);
  word-break:break-all;
}

.disconnect{
  margin-top:15px;
  background:transparent;
  border:1px solid #333;
  color:#777;
  padding:8px 12px;
  font-size:9px;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:80px 20px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
}

.error{
  grid-column:1/-1;
  text-align:center;
  padding:50px;
  color:#ff6b6b;
  font-size:11px;
}

@media(max-width:1100px){
  .gallery{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:700px){
  .header-inner{
    padding:12px 15px;
  }

  .brand-name{
    font-size:16px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .gallery-wrap,
  .toolbar{
    padding-left:12px;
    padding-right:12px;
  }

  .filters{
    width:100%;
  }

  select,
  .search{
    flex:1;
    min-width:130px;
  }
}
</style>

<script type="module">

import {
  BrowserProvider,
  Contract,
  parseEther
} from "https://cdn.jsdelivr.net/npm/ethers@6.15.0/+esm";

/* =========================================================
   CONTRACT
========================================================= */

const RPC_URL = "https://rpc.testnet.arc.network";

const CONTRACT_ADDRESS =
  "0x1aa4e3d6765ad2a0244b69681a34e48779dc8d65";

const CHAIN_ID = 5042002;

const ABI = [

  "function previewTokenURI(uint256 tokenId) view returns (string)",

  "function isGenesisMinted(uint256 tokenId) view returns (bool)",

  "function isGenesisAvailable(uint256 tokenId) view returns (bool)",

  "function rarityScore(uint256 tokenId) view returns (uint256)",

  "function mintPrice() view returns (uint256)",

  "function mint(uint256[] tokenIds) payable",

  "function genesisMinted() view returns (uint256)",

  "function activeSupply() view returns (uint256)"

];

/* =========================================================
   PRICE TABLE
=========================================================

   The current Solidity contract has one global mintPrice().
   Individual prices are therefore kept here until an
   individual-price mechanism is added to the contract.

   Set prices like:

   1: "10",
   2: "12",
   3: "15"

   Values are USDC-style display values.

========================================================= */

const CUSTOM_PRICES = {
  // 1: 10,
  // 2: 12,
  // 3: 15
};

let contract;
let provider;
let signer;
let walletAddress = null;

let globalMintPrice = 0;

const TOTAL = 3600;
const PER_PAGE = 24;

let currentPage = 1;
let currentItems = [];

const state = new Map();

/* =========================================================
   DOM
========================================================= */

const gallery = document.getElementById("gallery");
const pageNumber = document.getElementById("pageNumber");
const prevPage = document.getElementById("prevPage");
const nextPage = document.getElementById("nextPage");
const sortSelect = document.getElementById("sort");
const statusFilter = document.getElementById("statusFilter");
const search = document.getElementById("search");

const overlay = document.getElementById("overlay");
const closePanel = document.getElementById("closePanel");

const detailImage = document.getElementById("detailImage");
const detailId = document.getElementById("detailId");
const detailPrice = document.getElementById("detailPrice");
const detailStatus = document.getElementById("detailStatus");
const detailMint = document.getElementById("detailMint");

const walletBtn = document.getElementById("walletBtn");
const walletBox = document.getElementById("walletBox");
const walletAddressEl = document.getElementById("walletAddress");
const disconnectBtn = document.getElementById("disconnectBtn");

/* =========================================================
   CONTRACT READ PROVIDER
========================================================= */

const readProvider =
  new BrowserProvider(
    new ethers.JsonRpcProvider(RPC_URL)
  );

/* =========================================================
   PRICE
========================================================= */

function getPrice(id){

  if(CUSTOM_PRICES[id] !== undefined){
    return Number(CUSTOM_PRICES[id]);
  }

  return globalMintPrice;
}

function formatPrice(value){

  if(value === 0){
    return "FREE";
  }

  return `${value} USDC`;
}

/* =========================================================
   DATA URI PARSER
========================================================= */

function parseTokenURI(uri){

  try{

    const prefix =
      "data:application/json;base64,";

    if(!uri.startsWith(prefix)){
      throw new Error("Unexpected metadata format");
    }

    const json =
      atob(uri.slice(prefix.length));

    return JSON.parse(json);

  }catch(error){

    console.error("Metadata parse error:",error);
    return null;

  }
}

/* =========================================================
   RETRY
========================================================= */

async function retry(fn, attempts=4){

  let lastError;

  for(let i=0;i<attempts;i++){

    try{
      return await fn();
    }catch(error){

      lastError = error;

      await new Promise(
        resolve => setTimeout(resolve, 300*(i+1))
      );

    }

  }

  throw lastError;

}

/* =========================================================
   TOKEN DATA
========================================================= */

async function loadToken(id){

  if(state.has(id)){
    return state.get(id);
  }

  const data = {
    id,
    minted:false,
    available:false,
    rarity:0,
    image:null,
    traits:{}
  };

  try{

    data.minted =
      await retry(
        () => contractRead().isGenesisMinted(id)
      );

    data.available = !data.minted;

    data.rarity =
      Number(
        await retry(
          () => contractRead().rarityScore(id)
        )
      );

    /*
      previewTokenURI is retried independently because
      occasional Arc RPC calls can return missing revert data.
    */

    const uri =
      await retry(
        () => contractRead().previewTokenURI(id),
        4
      );

    const metadata =
      parseTokenURI(uri);

    if(metadata){

      data.image = metadata.image;

      if(Array.isArray(metadata.attributes)){

        for(const attr of metadata.attributes){

          data.traits[attr.trait_type] =
            attr.value;

        }

      }

    }

  }catch(error){

    console.warn(
      `Token #${id} failed after retries`,
      error
    );

    data.error = true;

  }

  state.set(id,data);

  return data;
}

/* =========================================================
   READ CONTRACT
========================================================= */

function contractRead(){

  return new Contract(
    CONTRACT_ADDRESS,
    ABI,
    readProvider
  );

}

/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

  try{

    contract = contractRead();

    globalMintPrice =
      Number(
        await retry(
          () => contract.mintPrice()
        )
      );

    /*
      Load availability progressively.
      We don't request all 3600 previews at once.
    */

    await loadPage(1);

  }catch(error){

    console.error(error);

    gallery.innerHTML =
      `<div class="error">
        Unable to connect to Arc Testnet.
      </div>`;

  }

}

/* =========================================================
   LOAD PAGE
========================================================= */

async function loadPage(page){

  gallery.innerHTML =
    `<div class="loading">
      LOADING ARCHITECTS...
    </div>`;

  currentPage = page;

  const start =
    (page-1)*PER_PAGE+1;

  const end =
    Math.min(
      TOTAL,
      start+PER_PAGE-1
    );

  const ids = [];

  for(let id=start;id<=end;id++){
    ids.push(id);
  }

  const results = [];

  /*
    Small batches avoid overwhelming the RPC.
  */

  for(let i=0;i<ids.length;i+=4){

    const batch =
      ids.slice(i,i+4);

    const batchResults =
      await Promise.all(
        batch.map(id => loadToken(id))
      );

    results.push(...batchResults);

    await new Promise(
      resolve => setTimeout(resolve,80)
    );

  }

  currentItems = results;

  render();

}

/* =========================================================
   FILTER + SORT
========================================================= */

function filteredItems(){

  let items =
    Array.from(state.values());

  const searchValue =
    Number(search.value);

  if(searchValue){

    items =
      items.filter(
        x => x.id === searchValue
      );

  }

  if(statusFilter.value === "available"){

    items =
      items.filter(x => x.available);

  }

  if(statusFilter.value === "minted"){

    items =
      items.filter(x => x.minted);

  }

  const sort =
    sortSelect.value;

  items.sort((a,b)=>{

    if(sort==="idAsc")
      return a.id-b.id;

    if(sort==="idDesc")
      return b.id-a.id;

    if(sort==="priceAsc")
      return getPrice(a.id)-getPrice(b.id);

    if(sort==="priceDesc")
      return getPrice(b.id)-getPrice(a.id);

    if(sort==="rarityAsc")
      return a.rarity-b.rarity;

    if(sort==="rarityDesc")
      return b.rarity-a.rarity;

    return a.id-b.id;

  });

  return items;

}

/* =========================================================
   RENDER
========================================================= */

function render(){

  const items =
    filteredItems();

  gallery.innerHTML = "";

  if(items.length === 0){

    gallery.innerHTML =
      `<div class="loading">
        NO TOKENS FOUND
      </div>`;

  }

  for(const item of items){

    const card =
      document.createElement("article");

    card.className = "card";

    const image =
      document.createElement("img");

    image.className =
      "card-image";

    image.src =
      item.image || "";

    image.alt =
      `ARC 360 #${String(item.id).padStart(4,"0")}`;

    const info =
      document.createElement("div");

    info.className =
      "card-info";

    const id =
      String(item.id).padStart(4,"0");

    const price =
      getPrice(item.id);

    info.innerHTML = `

      <div class="card-id">
        ARC 360 #${id}
      </div>

      <div class="card-price">
        ${formatPrice(price)}
      </div>

      <div class="card-status ${item.available ? "available":"minted"}">
        ${item.available ? "AVAILABLE":"MINTED"}
      </div>

      <div class="card-actions">

        <button class="details-btn">
          DETAILS
        </button>

        <button
          class="mint-btn"
          ${item.available ? "":"disabled"}>
          ${item.available ? "MINT":"MINTED"}
        </button>

      </div>
    `;

    card.appendChild(image);
    card.appendChild(info);

    card
      .querySelector(".details-btn")
      .onclick = () => openDetails(item.id);

    card
      .querySelector(".mint-btn")
      .onclick = event => {
        event.stopPropagation();
        mintToken(item.id);
      };

    card.onclick = event => {

      if(
        event.target.tagName === "BUTTON"
      ) return;

      openDetails(item.id);

    };

    gallery.appendChild(card);

  }

  pageNumber.textContent =
    `PAGE ${currentPage} / ${Math.ceil(TOTAL/PER_PAGE)}`;

  prevPage.disabled =
    currentPage === 1;

  nextPage.disabled =
    currentPage === Math.ceil(TOTAL/PER_PAGE);

}

/* =========================================================
   DETAILS
========================================================= */

async function openDetails(id){

  const item =
    await loadToken(id);

  detailImage.src =
    item.image || "";

  detailId.textContent =
    `ARC 360 #${String(id).padStart(4,"0")}`;

  detailPrice.textContent =
    formatPrice(getPrice(id));

  detailStatus.textContent =
    item.available
      ? "AVAILABLE"
      : "MINTED";

  detailStatus.className =
    `detail-status ${
      item.available
      ? "available"
      : "minted"
    }`;

  document.getElementById("traitFace").textContent =
    item.traits.Face ?? "—";

  document.getElementById("traitEyes").textContent =
    item.traits.Eyes ?? "—";

  document.getElementById("traitJaw").textContent =
    item.traits.Jaw ?? "—";

  document.getElementById("traitHair").textContent =
    item.traits.Hair ?? "—";

  document.getElementById("traitHorns").textContent =
    item.traits.Horns ?? "—";

  document.getElementById("traitHead").textContent =
    item.traits.Head ?? "—";

  document.getElementById("traitRarity").textContent =
    item.rarity;

  detailMint.disabled =
    !item.available;

  detailMint.textContent =
    item.available
      ? "MINT"
      : "MINTED";

  detailMint.onclick =
    () => mintToken(id);

  overlay.classList.add("open");

}

/* =========================================================
   MINT
========================================================= */

async function mintToken(id){

  try{

    if(!signer){

      await connectWallet();

      if(!signer){
        return;
      }

    }

    const current =
      await contract
        .connect(signer)
        .isGenesisMinted(id);

    if(current){

      alert("This ARC 360 is already minted.");
      return;

    }

    const price =
      getPrice(id);

    const value =
      price === 0
        ? 0n
        : parseEther(String(price));

    const tx =
      await contract
        .connect(signer)
        .mint([id],{
          value
        });

    detailMint.disabled = true;
    detailMint.textContent = "MINTING...";

    await tx.wait();

    alert(
      `ARC 360 #${String(id).padStart(4,"0")} minted successfully.`
    );

    state.delete(id);

    await loadPage(currentPage);

    overlay.classList.remove("open");

  }catch(error){

    console.error(error);

    alert(
      error?.shortMessage ||
      error?.reason ||
      "Mint failed."
    );

  }

}

/* =========================================================
   WALLET
========================================================= */

async function connectWallet(){

  if(!window.ethereum){

    alert(
      "Please install MetaMask or another compatible wallet."
    );

    return;

  }

  try{

    provider =
      new BrowserProvider(
        window.ethereum
      );

    const network =
      await provider.getNetwork();

    if(Number(network.chainId) !== CHAIN_ID){

      try{

        await window.ethereum.request({
          method:"wallet_switchEthereumChain",
          params:[
            {
              chainId:"0x4CF852"
            }
          ]
        });

      }catch(error){

        if(error.code === 4902){

          await window.ethereum.request({
            method:"wallet_addEthereumChain",
            params:[
              {
                chainId:"0x4CF852",
                chainName:"Arc Testnet",
                nativeCurrency:{
                  name:"USDC",
                  symbol:"USDC",
                  decimals:18
                },
                rpcUrls:[
                  RPC_URL
                ],
                blockExplorerUrls:[
                  "https://explorer.testnet.arc.io"
                ]
              }
            ]
          });

        }else{
          throw error;
        }

      }

      provider =
        new BrowserProvider(
          window.ethereum
        );

    }

    signer =
      await provider.getSigner();

    walletAddress =
      await signer.getAddress();

    walletAddressEl.textContent =
      walletAddress;

    walletBtn.textContent =
      walletAddress.slice(0,6)
      + "..."
      + walletAddress.slice(-4);

    walletBox.classList.add("open");

    contract =
      new Contract(
        CONTRACT_ADDRESS,
        ABI,
        signer
      );

  }catch(error){

    console.error(error);

    alert(
      error?.shortMessage ||
      "Wallet connection failed."
    );

  }

}

walletBtn.onclick = () => {

  if(signer){

    walletBox.classList.toggle("open");

  }else{

    connectWallet();

  }

};

disconnectBtn.onclick = () => {

  signer = null;
  walletAddress = null;

  walletBox.classList.remove("open");

  walletBtn.textContent =
    "Connect Wallet";

};

/* =========================================================
   EVENTS
========================================================= */

prevPage.onclick = () => {

  if(currentPage > 1){
    loadPage(currentPage-1);
  }

};

nextPage.onclick = () => {

  const max =
    Math.ceil(TOTAL/PER_PAGE);

  if(currentPage < max){
    loadPage(currentPage+1);
  }

};

sortSelect.onchange = () => render();
statusFilter.onchange = () => render();

search.oninput = () => {

  const value =
    Number(search.value);

  if(value >= 1 && value <= TOTAL){

    const targetPage =
      Math.ceil(value/PER_PAGE);

    if(targetPage !== currentPage){

      loadPage(targetPage);

    }else{

      render();

    }

  }else{

    render();

  }

};

closePanel.onclick = () => {
  overlay.classList.remove("open");
};

overlay.onclick = event => {

  if(event.target === overlay){
    overlay.classList.remove("open");
  }

};

/* =========================================================
   START
========================================================= */

init();

</script>
