<footer>

</footer>


<script>

/* =========================================================
   ARC TESTNET CONFIGURATION
========================================================= */

const RPC_URL = "https://rpc.testnet.arc.network";

/*
 * IMPORTANT:
 * Replace this with the address of the NEW ARC 360 contract
 * after deployment.
 */
const CONTRACT_ADDRESS = "0x1aa4e3d6765ad2a0244b69681a34e48779dc8d65";

const GENESIS_SUPPLY = 3600;


/* =========================================================
   CONTRACT ABI
========================================================= */

const ABI = [
  {
    "inputs": [
      {
        "internalType": "uint256",
        "name": "tokenId",
        "type": "uint256"
      }
    ],
    "name": "previewTokenURI",
    "outputs": [
      {
        "internalType": "string",
        "name": "",
        "type": "string"
      }
    ],
    "stateMutability": "pure",
    "type": "function"
  }
];


/* =========================================================
   SIMPLE JSON-RPC CLIENT
   No wallet required.
========================================================= */

async function rpc(method, params = []) {

  const response = await fetch(RPC_URL, {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      jsonrpc: "2.0",
      id: Date.now(),
      method,
      params
    })
  });

  if (!response.ok) {
    throw new Error("RPC HTTP error: " + response.status);
  }

  const data = await response.json();

  if (data.error) {
    throw new Error(data.error.message || "RPC error");
  }

  return data.result;
}


/* =========================================================
   ABI ENCODING
========================================================= */

/*
 * Function selector for:
 *
 * previewTokenURI(uint256)
 *
 * The selector is calculated automatically below.
 *
 * This avoids requiring ethers.js or another external library.
 */

async function sha256Hex(text) {

  const encoder = new TextEncoder();

  const data = encoder.encode(text);

  const hash = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return Array.from(
    new Uint8Array(hash)
  )
  .map(
    b => b.toString(16).padStart(2, "0")
  )
  .join("");
}


/*
 * Ethereum uses Keccak-256, not SHA-256.
 *
 * For maximum compatibility we load ethers.js dynamically
 * only for ABI encoding/decoding.
 */

let ethersLoaded = false;


/* =========================================================
   LOAD ETHERS
========================================================= */

async function loadEthers() {

  if (ethersLoaded && window.ethers) {
    return;
  }

  await new Promise((resolve, reject) => {

    const script = document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js";

    script.onload = resolve;

    script.onerror = () =>
      reject(
        new Error("Could not load ethers.js")
      );

    document.head.appendChild(script);

  });

  ethersLoaded = true;
}


/* =========================================================
   CONTRACT CALL
========================================================= */

async function previewToken(tokenId) {

  await loadEthers();

  if (
    !CONTRACT_ADDRESS ||
    CONTRACT_ADDRESS ===
      "0x1aa4e3d6765ad2a0244b69681a34e48779dc8d65"
  ) {

    throw new Error(
      "Set CONTRACT_ADDRESS with the new ARC 360 contract address."
    );
  }


  const iface =
    new ethers.Interface(ABI);


  const calldata =
    iface.encodeFunctionData(
      "previewTokenURI",
      [tokenId]
    );


  const result =
    await rpc(
      "eth_call",
      [
        {
          to: CONTRACT_ADDRESS,
          data: calldata
        },
        "latest"
      ]
    );


  const decoded =
    iface.decodeFunctionResult(
      "previewTokenURI",
      result
    );


  return decoded[0];
}


/* =========================================================
   TOKEN URI PARSER
========================================================= */

function parseTokenURI(uri) {

  if (
    !uri ||
    !uri.startsWith(
      "data:application/json;base64,"
    )
  ) {

    throw new Error(
      "Invalid tokenURI returned by contract."
    );
  }


  const encoded =
    uri.substring(
      "data:application/json;base64,".length
    );


  const jsonText =
    decodeURIComponent(
      Array.prototype.map.call(
        atob(encoded),
        c =>
          "%" +
          ("00" + c.charCodeAt(0).toString(16))
            .slice(-2)
      ).join("")
    );


  return JSON.parse(jsonText);
}


/* =========================================================
   CREATE NFT CARD
========================================================= */

function createCard(tokenId, metadata) {

  const card =
    document.createElement("div");

  card.className = "card";


  const art =
    document.createElement("div");

  art.className = "art";


  const img =
    document.createElement("img");

  img.src = metadata.image;

  img.alt =
    "ARC 360 #" +
    String(tokenId).padStart(4, "0");


  art.appendChild(img);


  const name =
    document.createElement("div");

  name.className =
    "token-name";

  name.textContent =
    "ARC 360 #" +
    String(tokenId).padStart(4, "0");


  const info =
    document.createElement("div");

  info.className =
    "token-info";


  let attributes = "";


  if (
    Array.isArray(metadata.attributes)
  ) {

    attributes =
      metadata.attributes
        .map(attribute => {

          return (
            attribute.trait_type +
            ": " +
            attribute.value
          );

        })
        .join("<br>");
  }


  info.innerHTML = attributes;


  card.appendChild(art);
  card.appendChild(name);
  card.appendChild(info);


  return card;
}


/* =========================================================
   LOAD ONE TOKEN
========================================================= */

async function loadSingle() {

  const input =
    document.getElementById(
      "tokenInput"
    );


  const tokenId =
    Number(input.value);


  if (
    !Number.isInteger(tokenId) ||
    tokenId < 1 ||
    tokenId > GENESIS_SUPPLY
  ) {

    alert(
      "Token ID must be between 1 and 3600."
    );

    return;
  }


  const gallery =
    document.getElementById(
      "gallery"
    );


  const status =
    document.getElementById(
      "status"
    );


  gallery.innerHTML =
    '<div class="loading">READING CONTRACT...</div>';


  try {

    const uri =
      await previewToken(tokenId);


    const metadata =
      parseTokenURI(uri);


    gallery.innerHTML = "";


    gallery.appendChild(
      createCard(
        tokenId,
        metadata
      )
    );


    status.textContent =
      "READING ARC TESTNET • TOKEN #" +
      tokenId;


  } catch (error) {

    showError(error);

  }

}


/* =========================================================
   LOAD FIRST 24
========================================================= */

async function loadPreview() {

  await loadRangeInternal(
    1,
    24
  );

}


/* =========================================================
   LOAD FIRST 100
========================================================= */

async function loadRange() {

  await loadRangeInternal(
    1,
    100
  );

}


/* =========================================================
   LOAD RANGE
========================================================= */

async function loadRangeInternal(
  start,
  end
) {

  const gallery =
    document.getElementById(
      "gallery"
    );


  const status =
    document.getElementById(
      "status"
    );


  gallery.innerHTML =
    '<div class="loading">READING ON-CHAIN SVGs...</div>';


  try {

    const total =
      end - start + 1;


    const results =
      new Array(total);


    /*
     * Process in small batches so the browser
     * does not hammer the public RPC.
     */

    const batchSize = 5;


    for (
      let i = 0;
      i < total;
      i += batchSize
    ) {

      const batch = [];


      for (
        let j = i;
        j < Math.min(
          i + batchSize,
          total
        );
        j++
      ) {

        const tokenId =
          start + j;


        batch.push(
          previewToken(tokenId)
            .then(uri => ({
              tokenId,
              uri
            }))
            .catch(error => ({
              tokenId,
              error
            }))
        );

      }


      const batchResults =
        await Promise.all(batch);


      batchResults.forEach(
        (result, index) => {

          results[
            i + index
          ] = result;

        }
      );


      status.textContent =
        "READING ON-CHAIN SVGs • " +
        Math.min(
          i + batchSize,
          total
        ) +
        " / " +
        total;

    }


    gallery.innerHTML = "";


    results.forEach(
      result => {

        if (result.error) {

          const errorCard =
            document.createElement(
              "div"
            );

          errorCard.className =
            "error";

          errorCard.textContent =
            "Token #" +
            result.tokenId +
            " — " +
            result.error.message;

          gallery.appendChild(
            errorCard
          );

          return;
        }


        try {

          const metadata =
            parseTokenURI(
              result.uri
            );


          gallery.appendChild(
            createCard(
              result.tokenId,
              metadata
            )
          );

        } catch (error) {

          const errorCard =
            document.createElement(
              "div"
            );

          errorCard.className =
            "error";

          errorCard.textContent =
            "Token #" +
            result.tokenId +
            " — invalid metadata";

          gallery.appendChild(
            errorCard
          );

        }

      }
    );


    status.textContent =
      "ARC TESTNET • " +
      total +
      " ON-CHAIN PREVIEWS LOADED";


  } catch (error) {

    showError(error);

  }

}


/* =========================================================
   ERROR
========================================================= */

function showError(error) {

  const gallery =
    document.getElementById(
      "gallery"
    );


  const status =
    document.getElementById(
      "status"
    );


  gallery.innerHTML = "";


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "error";


  box.innerHTML =
    "<strong>PREVIEW ERROR</strong><br><br>" +
    escapeHtml(
      error.message || String(error)
    );


  gallery.appendChild(box);


  status.textContent =
    "CONNECTION ERROR";

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(text) {

  return String(text)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize() {

  const status =
    document.getElementById(
      "status"
    );


  try {

    const block =
      await rpc(
        "eth_blockNumber"
      );


    status.textContent =
      "ARC TESTNET ONLINE • BLOCK " +
      parseInt(
        block,
        16
      );


    /*
     * Automatically load a small preview.
     */

    if (
      CONTRACT_ADDRESS &&
      CONTRACT_ADDRESS !==
        "0x1aa4e3d6765ad2a0244b69681a34e48779dc8d65"
    ) {

      await loadPreview();

    } else {

      document.getElementById(
        "gallery"
      ).innerHTML = `
        <div class="error">
          CONTRACT ADDRESS NOT CONFIGURED<br><br>
          Set the new ARC 360 contract address
          in <b>CONTRACT_ADDRESS</b> inside index.html.
        </div>
      `;

    }


  } catch (error) {

    showError(error);

  }

}


initialize();

</script>

</body>
</html>
