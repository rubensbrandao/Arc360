<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ARC 360 — Architects</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5,5,5,.96);
    border-bottom: 1px solid #222;
    backdrop-filter: blur(10px);
}

.nav {
    max-width: 1500px;
    margin: auto;
    padding: 17px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 4px;
}

.wallet-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.wallet {
    color: #888;
    font-size: 12px;
}

button {
    background: #111;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    padding: 11px 17px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #1b1b1b;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.hero {
    min-height: 570px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 70px 20px;
    background:
        radial-gradient(
            circle at center,
            #222 0%,
            #0b0b0b 38%,
            #050505 72%
        );
    border-bottom: 1px solid #1b1b1b;
}

.hero-inner {
    max-width: 900px;
}

.hero h1 {
    margin: 0;
    font-size: clamp(55px, 11vw, 135px);
    font-weight: 900;
    letter-spacing: 9px;
}

.hero-sub {
    color: #999;
    line-height: 1.8;
    font-size: 15px;
}

.credit {
    margin-top: 35px;
    color: #555;
    font-size: 12px;
}

.stats {
    max-width: 1450px;
    margin: 30px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 14px;
}

.stat {
    background: #0b0b0b;
    border: 1px solid #222;
    border-radius: 9px;
    padding: 20px;
}

.stat-title {
    color: #666;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.stat-value {
    margin-top: 8px;
    font-size: 25px;
    font-weight: 800;
}

.notice {
    max-width: 1450px;
    margin: 0 auto 15px;
    padding: 0 20px;
    color: #777;
    font-size: 12px;
}

.controls {
    max-width: 1450px;
    margin: 20px auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.mint-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.quantity {
    display: flex;
    border: 1px solid #333;
    border-radius: 7px;
    overflow: hidden;
}

.quantity button {
    border: 0;
    border-radius: 0;
}

.quantity-value {
    min-width: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.total {
    color: #aaa;
    font-size: 13px;
}

.grid {
    max-width: 1450px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns:
        repeat(auto-fill,minmax(205px,1fr));
    gap: 15px;
}

.card {
    border: 1px solid #222;
    background: #0a0a0a;
    border-radius: 9px;
    overflow: hidden;
    transition: .18s ease;
}

.card:hover {
    transform: translateY(-3px);
    border-color: #555;
}

.image-box {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.nft-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    display: none;
}

.preview {
    width: 72%;
    height: 72%;
    position: relative;
}

.head {
    position: absolute;
    left: 20%;
    top: 15%;
    width: 60%;
    height: 55%;
    border: 3px solid #777;
    background: #101010;
    clip-path: polygon(
        15% 0,
        85% 0,
        100% 20%,
        92% 82%,
        75% 100%,
        25% 100%,
        8% 82%,
        0 20%
    );
}

.eye {
    position: absolute;
    top: 43%;
    width: 18%;
    height: 8%;
    background: #ddd;
}

.eye1 {
    left: 23%;
}

.eye2 {
    right: 23%;
}

.jaw {
    position: absolute;
    left: 31%;
    bottom: 13%;
    width: 38%;
    height: 12%;
    border-top: 2px solid #777;
}

.horn {
    position: absolute;
    top: 4%;
    width: 13%;
    height: 30%;
    background: #777;
}

.horn1 {
    left: 10%;
    clip-path: polygon(100% 100%,0 0,100% 0);
}

.horn2 {
    right: 10%;
    clip-path: polygon(0 100%,0 0,100% 0);
}

.card-info {
    padding: 14px;
}

.token-name {
    font-weight: 800;
    font-size: 16px;
}

.badge {
    display: inline-block;
    margin-top: 7px;
    padding: 4px 7px;
    font-size: 9px;
    border-radius: 4px;
    background: #181818;
    color: #999;
}

.badge.minted {
    color: #eee;
    background: #292929;
}

.traits {
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}

.trait {
    border: 1px solid #1c1c1c;
    border-radius: 4px;
    padding: 5px;
    font-size: 9px;
    color: #666;
}

.trait span {
    color: #aaa;
}

.loading {
    grid-column: 1/-1;
    padding: 70px 20px;
    text-align: center;
    color: #666;
}

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 500;
    max-width: 420px;
    padding: 15px 18px;
    background: #111;
    border: 1px solid #444;
    border-radius: 8px;
    display: none;
}

@media(max-width:800px) {
    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .hero h1 {
        letter-spacing: 4px;
    }
}

@media(max-width:500px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .grid {
        grid-template-columns: repeat(2,1fr);
        gap: 8px;
        padding: 10px;
    }

    .card-info {
        padding: 9px;
    }
}
</style>
</head>

<body>

<header>

<div class="nav">

    <div class="logo">
        ARC 360
    </div>

    <div class="wallet-area">

        <span
            class="wallet"
            id="walletText"
        >
            Wallet not connected
        </span>

        <button id="connectBtn">
            CONNECT WALLET
        </button>

    </div>

</div>

</header>


<section class="hero">

<div class="hero-inner">

    <h1>ARC 360</h1>

    <div class="hero-sub">
        3,600 Genesis Architects.<br>
        Deterministic on-chain DNA.
    </div>

    <div class="credit">
        ARC 360 - Rubens Brandao - X: @Rubensbrandao1
    </div>

</div>

</section>


<section class="stats">

<div class="stat">

    <div class="stat-title">
        Genesis Supply
    </div>

    <div
        class="stat-value"
        id="totalSupply"
    >
        3,600
    </div>

</div>


<div class="stat">

    <div class="stat-title">
        Minted
    </div>

    <div
        class="stat-value"
        id="minted"
    >
        —
    </div>

</div>


<div class="stat">

    <div class="stat-title">
        Available
    </div>

    <div
        class="stat-value"
        id="available"
    >
        —
    </div>

</div>


<div class="stat">

    <div class="stat-title">
        Mint Price
    </div>

    <div
        class="stat-value"
        id="mintPrice"
    >
        —
    </div>

</div>

</section>


<div
    class="notice"
    id="notice"
>
    Connect your wallet to load ARC 360.
</div>


<section class="controls">

<div class="mint-controls">

    <div class="quantity">

        <button onclick="changeQuantity(-1)">
            −
        </button>

        <div
            class="quantity-value"
            id="quantity"
        >
            1
        </div>

        <button onclick="changeQuantity(1)">
            +
        </button>

    </div>


    <div
        class="total"
        id="total"
    >
        Total: —
    </div>


    <button
        id="mintButton"
        onclick="mintNFT()"
        disabled
    >
        MINT
    </button>

</div>


<button onclick="loadCollection()">
    REFRESH
</button>

</section>


<section
    class="grid"
    id="grid"
>

<div class="loading">
    Connect your wallet to load the collection.
</div>

</section>


<div
    class="toast"
    id="toast"
></div>


<script>

const CONTRACT_ADDRESS =
    "0xcbbb4e13fdfe87ded8fa896e8833058dcda92c1a";

const GENESIS_SUPPLY = 3600;

const MAX_MINT = 20;


const ABI = [

    "function genesisMinted() view returns (uint256)",

    "function activeSupply() view returns (uint256)",

    "function mintPrice() view returns (uint256)",

    "function mint(uint256 quantity) payable",

    "function ownerOf(uint256 tokenId) view returns (address)",

    "function tokenURI(uint256 tokenId) view returns (string)"

];


let provider;

let signer;

let contract;

let mintPrice = 0n;

let quantity = 1;


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.innerText = message;

    toast.style.display = "block";

    clearTimeout(window.toastTimeout);

    window.toastTimeout =
        setTimeout(() => {

            toast.style.display =
                "none";

        },5000);
}


function shortAddress(address) {

    return (
        address.substring(0,6) +
        "..." +
        address.substring(address.length-4)
    );

}


function changeQuantity(value) {

    quantity += value;

    if(quantity < 1)
        quantity = 1;

    if(quantity > MAX_MINT)
        quantity = MAX_MINT;

    document.getElementById(
        "quantity"
    ).innerText = quantity;

    updateTotal();

}


function updateTotal() {

    const total =
        mintPrice *
        BigInt(quantity);

    document.getElementById(
        "total"
    ).innerText =
        "Total: " +
        ethers.formatEther(total);

}


async function connectWallet() {

    if(!window.ethereum) {

        showToast(
            "MetaMask or another Web3 wallet is required."
        );

        return;

    }


    try {

        provider =
            new ethers.BrowserProvider(
                window.ethereum
            );


        await provider.send(
            "eth_requestAccounts",
            []
        );


        signer =
            await provider.getSigner();


        contract =
            new ethers.Contract(
                CONTRACT_ADDRESS,
                ABI,
                signer
            );


        const address =
            await signer.getAddress();


        document.getElementById(
            "walletText"
        ).innerText =
            shortAddress(address);


        document.getElementById(
            "connectBtn"
        ).innerText =
            "CONNECTED";


        document.getElementById(
            "mintButton"
        ).disabled = false;


        await loadCollection();

    }

    catch(error) {

        console.error(error);

        showToast(
            error.shortMessage ||
            error.message ||
            "Wallet connection failed."
        );

    }

}


async function loadCollection() {

    if(!contract) {

        showToast(
            "Connect your wallet first."
        );

        return;

    }


    try {

        document.getElementById(
            "notice"
        ).innerText =
            "Reading ARC 360 contract...";


        const minted =
            await contract.genesisMinted();


        mintPrice =
            await contract.mintPrice();


        const mintedNumber =
            Number(minted);


        document.getElementById(
            "minted"
        ).innerText =
            mintedNumber.toLocaleString();


        document.getElementById(
            "available"
        ).innerText =
            (
                GENESIS_SUPPLY -
                mintedNumber
            ).toLocaleString();


        document.getElementById(
            "mintPrice"
        ).innerText =
            ethers.formatEther(mintPrice);


        updateTotal();


        document.getElementById(
            "notice"
        ).innerText =
            "ARC 360 loaded.";


        renderCards(mintedNumber);

    }

    catch(error) {

        console.error(error);

        showToast(
            "Could not read the ARC 360 contract."
        );

    }

}


function genesisDNA(tokenId) {

    const TOTAL = 165888;

    let index =
        (
            (tokenId - 1) *
            65537 +
            31739
        ) % TOTAL;


    const face =
        (index % 6) + 1;

    index =
        Math.floor(index / 6);


    const eyes =
        (index % 8) + 1;

    index =
        Math.floor(index / 8);


    const jaw =
        (index % 6) + 1;

    index =
        Math.floor(index / 6);


    const hair =
        (index % 10) + 1;

    index =
        Math.floor(index / 10);


    const horns =
        (index % 8) + 1;

    index =
        Math.floor(index / 8);


    const head =
        (index % 12) + 1;


    return {
        face,
        eyes,
        jaw,
        hair,
        horns,
        head
    };

}


function createPreview(dna) {

    return `

        <div class="preview">

            <div class="horn horn1"></div>

            <div class="horn horn2"></div>

            <div class="head">

                <div class="eye eye1"></div>

                <div class="eye eye2"></div>

                <div class="jaw"></div>

            </div>

        </div>

    `;

}


function renderCards(mintedCount) {

    const grid =
        document.getElementById("grid");

    grid.innerHTML = "";


    const fragment =
        document.createDocumentFragment();


    for(
        let id = 1;
        id <= GENESIS_SUPPLY;
        id++
    ) {

        const dna =
            genesisDNA(id);


        const card =
            document.createElement("article");


        card.className =
            "card";


        card.dataset.id =
            id;


        const minted =
            id <= mintedCount;


        card.innerHTML = `

            <div class="image-box">

                ${createPreview(dna)}

                <img
                    class="nft-image"
                    alt="ARC 360 #${id}"
                >

            </div>


            <div class="card-info">

                <div class="token-name">
                    ARC 360 #${String(id).padStart(4,"0")}
                </div>


                <span class="badge ${
                    minted ? "minted" : ""
                }">

                    ${
                        minted
                        ? "MINTED"
                        : "AVAILABLE"
                    }

                </span>


                <div class="traits">

                    <div class="trait">
                        FACE
                        <span>${dna.face}</span>
                    </div>

                    <div class="trait">
                        EYES
                        <span>${dna.eyes}</span>
                    </div>

                    <div class="trait">
                        JAW
                        <span>${dna.jaw}</span>
                    </div>

                    <div class="trait">
                        HAIR
                        <span>${dna.hair}</span>
                    </div>

                    <div class="trait">
                        HORNS
                        <span>${dna.horns}</span>
                    </div>

                    <div class="trait">
                        HEAD
                        <span>${dna.head}</span>
                    </div>

                </div>

            </div>

        `;


        fragment.appendChild(card);

    }


    grid.appendChild(fragment);


    /*
       Only minted NFTs can safely be queried
       through ownerOf/tokenURI with the contract
       currently shown.
    */

    if(mintedCount > 0) {

        loadRealSVGs(mintedCount);

    }

}


async function loadRealSVGs(mintedCount) {

    const BATCH = 10;


    for(
        let start = 1;
        start <= mintedCount;
        start += BATCH
    ) {

        const jobs = [];


        for(
            let id = start;
            id < start + BATCH &&
            id <= mintedCount;
            id++
        ) {

            jobs.push(
                loadNFTImage(id)
            );

        }


        await Promise.allSettled(jobs);

    }

}


async function loadNFTImage(id) {

    try {

        const uri =
            await contract.tokenURI(id);


        const image =
            parseTokenURI(uri);


        if(!image)
            return;


        const card =
            document.querySelector(
                `.card[data-id="${id}"]`
            );


        if(!card)
            return;


        const img =
            card.querySelector(".nft-image");


        const preview =
            card.querySelector(".preview");


        img.src =
            image;


        img.onload = () => {

            img.style.display =
                "block";


            if(preview)
                preview.style.display =
                    "none";

        };

    }

    catch(error) {

        console.log(
            "SVG not available for #" +
            id,
            error
        );

    }

}


/*
============================================================
ROBUST TOKEN URI PARSER
============================================================
*/

function parseTokenURI(uri) {

    if(!uri)
        return null;


    /*
       CASE 1

       Direct SVG data URI.
    */

    if(
        uri.startsWith(
            "data:image/svg+xml;base64,"
        )
    ) {

        return uri;

    }


    /*
       CASE 2

       URL encoded SVG.
    */

    if(
        uri.startsWith(
            "data:image/svg+xml,"
        )
    ) {

        return uri;

    }


    /*
       CASE 3

       Raw SVG.
    */

    if(
        uri.trim().startsWith("<svg")
    ) {

        return (
            "data:image/svg+xml;charset=utf-8," +
            encodeURIComponent(uri)
        );

    }


    /*
       CASE 4

       Base64 JSON metadata.
    */

    if(
        uri.startsWith(
            "data:application/json;base64,"
        )
    ) {

        try {

            const encoded =
                uri.substring(
                    "data:application/json;base64,"
                        .length
                );


            const jsonText =
                decodeURIComponent(
                    Array.prototype.map
                        .call(
                            atob(encoded),
                            c =>
                                "%" +
                                (
                                    "00" +
                                    c.charCodeAt(0)
                                        .toString(16)
                                ).slice(-2)
                        )
                        .join("")
                );


            const metadata =
                JSON.parse(jsonText);


            return extractImage(
                metadata.image
            );

        }

        catch(error) {

            /*
               Some contracts use UTF-8
               base64 directly.
            */

            try {

                const encoded =
                    uri.substring(
                        "data:application/json;base64,"
                            .length
                    );


                const binary =
                    atob(encoded);


                const bytes =
                    Uint8Array.from(
                        binary,
                        c => c.charCodeAt(0)
                    );


                const text =
                    new TextDecoder()
                        .decode(bytes);


                const metadata =
                    JSON.parse(text);


                return extractImage(
                    metadata.image
                );

            }

            catch(e) {

                return null;

            }

        }

    }


    /*
       CASE 5

       Plain JSON data URI.
    */

    if(
        uri.startsWith(
            "data:application/json,"
        )
    ) {

        try {

            const jsonText =
                decodeURIComponent(
                    uri.substring(
                        "data:application/json,"
                            .length
                    )
                );


            const metadata =
                JSON.parse(jsonText);


            return extractImage(
                metadata.image
            );

        }

        catch(error) {

            return null;

        }

    }


    /*
       CASE 6

       Some implementations return
       JSON directly.
    */

    if(
        uri.trim().startsWith("{")
    ) {

        try {

            const metadata =
                JSON.parse(uri);


            return extractImage(
                metadata.image
            );

        }

        catch(error) {

            return null;

        }

    }


    /*
       CASE 7

       IPFS / HTTP metadata.

       Browser can load it directly.
    */

    if(
        uri.startsWith("ipfs://")
    ) {

        return null;

    }


    if(
        uri.startsWith("http://") ||
        uri.startsWith("https://")
    ) {

        return null;

    }


    return null;

}


function extractImage(image) {

    if(!image)
        return null;


    /*
       Direct SVG.
    */

    if(
        image.startsWith(
            "data:image/svg+xml;base64,"
        )
    ) {

        return image;

    }


    if(
        image.startsWith(
            "data:image/svg+xml,"
        )
    ) {

        return image;

    }


    /*
       Raw SVG.
    */

    if(
        image.trim().startsWith("<svg")
    ) {

        return (
            "data:image/svg+xml;charset=utf-8," +
            encodeURIComponent(image)
        );

    }


    /*
       IPFS.
    */

    if(
        image.startsWith("ipfs://")
    ) {

        return (
            "https://ipfs.io/ipfs/" +
            image.substring(7)
        );

    }


    return image;

}


async function mintNFT() {

    if(!contract) {

        await connectWallet();

        return;

    }


    try {

        const minted =
            Number(
                await contract.genesisMinted()
            );


        if(
            minted + quantity >
            GENESIS_SUPPLY
        ) {

            showToast(
                "Not enough Genesis NFTs remain."
            );

            return;

        }


        const total =
            mintPrice *
            BigInt(quantity);


        const button =
            document.getElementById(
                "mintButton"
            );


        button.disabled =
            true;


        button.innerText =
            "MINTING...";


        const tx =
            await contract.mint(
                quantity,
                {
                    value: total
                }
            );


        showToast(
            "Transaction submitted."
        );


        await tx.wait();


        showToast(
            "ARC 360 minted successfully."
        );


        await loadCollection();

    }

    catch(error) {

        console.error(error);


        showToast(
            error.shortMessage ||
            error.reason ||
            error.message ||
            "Mint failed."
        );

    }


    finally {

        const button =
            document.getElementById(
                "mintButton"
            );


        button.disabled =
            false;


        button.innerText =
            "MINT";

    }

}


document
    .getElementById("connectBtn")
    .addEventListener(
        "click",
        connectWallet
    );


if(window.ethereum) {

    window.ethereum.on(
        "accountsChanged",
        () => location.reload()
    );


    window.ethereum.on(
        "chainChanged",
        () => location.reload()
    );

}

</script>

</body>
</html>
