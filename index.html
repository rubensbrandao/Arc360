<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARC 360 — Test #0001</title>

<script
    src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"
    onerror="this.onerror=null;this.src='https://unpkg.com/ethers@6.13.5/dist/ethers.umd.min.js'">
</script>

<style>
    body {
        margin: 0;
        background: #050607;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }

    #app {
        width: min(600px, 100%);
        text-align: center;
    }

    img {
        width: 100%;
        max-width: 500px;
        image-rendering: pixelated;
        border: 1px solid #292e35;
        border-radius: 12px;
    }

    h1 {
        margin-bottom: 30px;
    }

    #status {
        color: #8b929b;
        margin: 20px 0;
        line-height: 1.6;
    }
</style>

</head>

<body>

<div id="app">

    <h1>ARC 360 #0001</h1>

    <div id="status">
        Loading Architect from contract...
    </div>

    <div id="testNFT"></div>

</div>

<script>

const CONTRACT_ADDRESS =
    "0x48fad98b637d35c449819782b542af0306e4a56d";

const RPC =
    "https://rpc.testnet.arc.network";


const ABI = [

    "function previewTokenURI(uint256 tokenId) view returns (string)"

];


async function loadNFT(tokenId) {

    try {

        const provider =
            new ethers.JsonRpcProvider(
                RPC
            );


        const contract =
            new ethers.Contract(
                CONTRACT_ADDRESS,
                ABI,
                provider
            );


        document.getElementById("status").textContent =
            "Reading previewTokenURI(" +
            tokenId +
            ")...";


        const uri =
            await contract.previewTokenURI(
                tokenId
            );


        console.log(
            "TOKEN URI:",
            uri
        );


        let metadata;


        /*
         * JSON BASE64
         */

        if (
            uri.startsWith(
                "data:application/json;base64,"
            )
        ) {

            const base64 =
                uri.split(",")[1];

            const binary =
                atob(base64);

            const bytes =
                Uint8Array.from(
                    binary,
                    char =>
                        char.charCodeAt(0)
                );

            const json =
                new TextDecoder(
                    "utf-8"
                ).decode(bytes);

            metadata =
                JSON.parse(json);

        }


        /*
         * JSON URI
         */

        else if (
            uri.startsWith(
                "data:application/json,"
            )
        ) {

            metadata =
                JSON.parse(
                    decodeURIComponent(
                        uri.substring(
                            "data:application/json,"
                                .length
                        )
                    )
                );

        }


        /*
         * Unsupported format
         */

        else {

            throw new Error(
                "previewTokenURI returned an unsupported format."
            );

        }


        console.log(
            "METADATA:",
            metadata
        );


        const image =
            metadata.image || "";


        document.getElementById(
            "testNFT"
        ).innerHTML = `

            <h2>
                ${metadata.name ||
                "ARC 360 #0001"}
            </h2>

            <img
                src="${image}"
                alt="ARC 360 #0001">

            <p>
                ${
                    metadata.description ||
                    "On-chain Architect"
                }
            </p>

        `;


        document.getElementById(
            "status"
        ).textContent =
            "✓ Architect loaded directly from the ARC 360 contract.";


        return metadata;


    } catch (error) {

        console.error(
            "ARC 360 ERROR:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            "ERROR: " +
            (
                error.shortMessage ||
                error.message ||
                error
            );

    }

}


/*
 * Start
 */

loadNFT(1);

</script>

</body>
</html>
