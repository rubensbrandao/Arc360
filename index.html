<!-- =====================================================
     ETHERS

<script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const RPC_URL =
  "https://rpc.testnet.arc.network";

const CONTRACT_ADDRESS =
  "0x1aa4e3d6765ad2a0244b69681a34e48779dc8d65";

const GENESIS_SUPPLY = 3600;


/* =====================================================
   CONTRACT ABI
===================================================== */

const ABI = [
  "function previewTokenURI(uint256 tokenId) view returns (string)"
];


/* =====================================================
   PROVIDER
===================================================== */

let provider;

let contract;


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

  const status =
    document.getElementById("status");

  try {

    provider =
      new ethers.JsonRpcProvider(
        RPC_URL,
        {
          chainId: 5042002,
          name: "arc-testnet"
        }
      );


    contract =
      new ethers.Contract(
        CONTRACT_ADDRESS,
        ABI,
        provider
      );


    /*
     * Test the actual contract immediately.
     */

    const test =
      await contract.previewTokenURI(1);


    if (!test) {
      throw new Error(
        "Contract returned an empty preview."
      );
    }


    status.textContent =
      "ARC TESTNET ONLINE • CONTRACT CONNECTED";


    /*
     * Automatically show first 24.
     */

    await loadTokens(1, 24);

  } catch (error) {

    console.error(error);

    showError(error);

  }

}


/* =====================================================
   GET TOKEN URI
===================================================== */

async function getTokenURI(tokenId) {

  return await contract.previewTokenURI(
    tokenId
  );

}


/* =====================================================
   DECODE BASE64 JSON
===================================================== */

function decodeBase64Unicode(base64) {

  const binary =
    atob(base64);

  const bytes =
    new Uint8Array(
      binary.length
    );

  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);

  }

  return new TextDecoder(
    "utf-8"
  ).decode(bytes);

}


/* =====================================================
   PARSE TOKEN URI
===================================================== */

function parseTokenURI(uri) {

  const prefix =
    "data:application/json;base64,";


  if (
    !uri.startsWith(prefix)
  ) {

    throw new Error(
      "Contract returned an invalid tokenURI."
    );

  }


  const base64 =
    uri.substring(
      prefix.length
    );


  const json =
    decodeBase64Unicode(
      base64
    );


  return JSON.parse(json);

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(
  tokenId,
  metadata
) {

  const card =
    document.createElement("div");

  card.className =
    "card";


  const art =
    document.createElement("div");

  art.className =
    "art";


  const img =
    document.createElement("img");

  img.src =
    metadata.image;

  img.alt =
    "ARC 360 #" +
    String(tokenId)
      .padStart(4, "0");


  art.appendChild(img);


  const name =
    document.createElement("div");

  name.className =
    "token-name";

  name.textContent =
    "ARC 360 #" +
    String(tokenId)
      .padStart(4, "0");


  const info =
    document.createElement("div");

  info.className =
    "token-info";


  if (
    Array.isArray(
      metadata.attributes
    )
  ) {

    info.innerHTML =
      metadata.attributes
        .map(attribute => {

          return (
            escapeHtml(
              attribute.trait_type
            ) +
            ": " +
            escapeHtml(
              attribute.value
            )
          );

        })
        .join("<br>");

  }


  card.appendChild(art);
  card.appendChild(name);
  card.appendChild(info);


  return card;

}


/* =====================================================
   LOAD ONE
===================================================== */

async function loadSingle() {

  const input =
    document.getElementById(
      "tokenInput"
    );


  const tokenId =
    Number(input.value);


  if (
    !Number.isInteger(tokenId) ||
    tokenId < 1 ||
    tokenId > GENESIS_SUPPLY
  ) {

    alert(
      "Enter a Token ID from 1 to 3600."
    );

    return;

  }


  const gallery =
    document.getElementById(
      "gallery"
    );


  const status =
    document.getElementById(
      "status"
    );


  gallery.innerHTML =
    '<div class="loading">READING TOKEN #' +
    tokenId +
    '...</div>';


  try {

    const uri =
      await getTokenURI(
        tokenId
      );


    const metadata =
      parseTokenURI(uri);


    gallery.innerHTML = "";


    gallery.appendChild(
      createCard(
        tokenId,
        metadata
      )
    );


    status.textContent =
      "ARC TESTNET • TOKEN #" +
      tokenId +
      " • ON-CHAIN";


  } catch (error) {

    console.error(error);

    showError(error);

  }

}


/* =====================================================
   LOAD MULTIPLE
===================================================== */

async function loadTokens(
  start,
  end
) {

  const gallery =
    document.getElementById(
      "gallery"
    );


  const status =
    document.getElementById(
      "status"
    );


  gallery.innerHTML =
    '<div class="loading">READING ON-CHAIN SVGs...</div>';


  const total =
    end - start + 1;


  try {

    const results = [];


    /*
     * Small batches protect the public RPC.
     */

    const batchSize = 4;


    for (
      let i = start;
      i <= end;
      i += batchSize
    ) {

      const batchEnd =
        Math.min(
          i + batchSize - 1,
          end
        );


      const promises = [];


      for (
        let tokenId = i;
        tokenId <= batchEnd;
        tokenId++
      ) {

        promises.push(
          getTokenURI(
            tokenId
          )
          .then(uri => ({
            tokenId,
            uri
          }))
          .catch(error => ({
            tokenId,
            error
          }))
        );

      }


      const batch =
        await Promise.all(
          promises
        );


      results.push(
        ...batch
      );


      status.textContent =
        "READING ON-CHAIN SVGs • " +
        results.length +
        " / " +
        total;

    }


    gallery.innerHTML = "";


    for (
      const result of results
    ) {

      if (result.error) {

        const error =
          document.createElement(
            "div"
          );

        error.className =
          "error";

        error.textContent =
          "Token #" +
          result.tokenId +
          " failed: " +
          result.error.message;

        gallery.appendChild(
          error
        );

        continue;
      }


      try {

        const metadata =
          parseTokenURI(
            result.uri
          );


        gallery.appendChild(
          createCard(
            result.tokenId,
            metadata
          )
        );

      } catch (error) {

        console.error(
          "Metadata error:",
          result.tokenId,
          error
        );

      }

    }


    status.textContent =
      "ARC TESTNET • " +
      total +
      " TOKENS • FULLY ON-CHAIN";


  } catch (error) {

    console.error(error);

    showError(error);

  }

}


/* =====================================================
   ERROR DISPLAY
===================================================== */

function showError(error) {

  const gallery =
    document.getElementById(
      "gallery"
    );


  const status =
    document.getElementById(
      "status"
    );


  gallery.innerHTML = "";


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "error";


  box.innerHTML =
    "<strong>FAILED TO LOAD PREVIEW</strong>" +
    "<br><br>" +
    escapeHtml(
      error?.shortMessage ||
      error?.reason ||
      error?.message ||
      String(error)
    );


  gallery.appendChild(
    box
  );


  status.textContent =
    "CONTRACT CONNECTION ERROR";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

initialize();

</script>

</body>
</html>
