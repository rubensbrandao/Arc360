<script>
const CONTRACT_ADDRESS = "COLE_AQUI_O_ENDERECO_DO_NOVO_CONTRATO";

const ARC_TESTNET = {
    chainId: "0x4CEB52",
    chainName: "Arc Testnet",
    nativeCurrency: {
        name: "USDC",
        symbol: "USDC",
        decimals: 18
    },
    rpcUrls: ["https://rpc.testnet.arc.network"],
    blockExplorerUrls: ["https://testnet.arcscan.app"]
};

const ABI = [
    "function GENESIS_SUPPLY() view returns (uint256)",
    "function MAX_MINT_PER_TX() view returns (uint256)",
    "function MAX_FUSE_INPUT() view returns (uint256)",
    "function genesisMinted() view returns (uint256)",
    "function activeSupply() view returns (uint256)",
    "function mintPrice() view returns (uint256)",
    "function mint(uint256 quantity) payable",
    "function fuse(uint256[] tokenIds)",
    "function ownerOf(uint256 tokenId) view returns (address)",
    "function tokenURI(uint256 tokenId) view returns (string)",
    "function getDNA(uint256 tokenId) view returns (uint256 face, uint256 eyes, uint256 jaw, uint256 hair, uint256 horns, uint256 head)",
    "function rarityScore(uint256 tokenId) view returns (uint256)",
    "function getParents(uint256 tokenId) view returns (uint256[])",
    "function discoverOrigin() pure returns (string)",
    "function COLLECTION_NAME() view returns (string)",
    "function COLLECTION_CREDIT() view returns (string)"
];

let provider;
let signer;
let contract;
let account = null;

async function connectWallet() {

    if (!window.ethereum) {
        alert("Please install MetaMask or another compatible wallet.");
        return;
    }

    provider = new ethers.BrowserProvider(window.ethereum);

    await provider.send("eth_requestAccounts", []);

    const network = await provider.getNetwork();

    if (network.chainId !== 5042002n) {
        try {
            await window.ethereum.request({
                method: "wallet_switchEthereumChain",
                params: [{ chainId: ARC_TESTNET.chainId }]
            });
        } catch (error) {

            if (error.code === 4902) {
                await window.ethereum.request({
                    method: "wallet_addEthereumChain",
                    params: [{
                        chainId: ARC_TESTNET.chainId,
                        chainName: ARC_TESTNET.chainName,
                        nativeCurrency: ARC_TESTNET.nativeCurrency,
                        rpcUrls: ARC_TESTNET.rpcUrls,
                        blockExplorerUrls: ARC_TESTNET.blockExplorerUrls
                    }]
                });
            } else {
                throw error;
            }
        }
    }

    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();

    account = await signer.getAddress();

    contract = new ethers.Contract(
        CONTRACT_ADDRESS,
        ABI,
        signer
    );

    updateWalletButton();
    loadCollection();
}

async function loadContract() {

    provider = new ethers.JsonRpcProvider(
        ARC_TESTNET.rpcUrls[0]
    );

    contract = new ethers.Contract(
        CONTRACT_ADDRESS,
        ABI,
        provider
    );

    await updateStats();
}

async function updateStats() {

    if (!contract) return;

    const genesisSupply =
        await contract.GENESIS_SUPPLY();

    const minted =
        await contract.genesisMinted();

    const active =
        await contract.activeSupply();

    const price =
        await contract.mintPrice();

    document.getElementById("genesisSupply").textContent =
        genesisSupply.toString();

    document.getElementById("minted").textContent =
        minted.toString();

    document.getElementById("activeSupply").textContent =
        active.toString();

    document.getElementById("remaining").textContent =
        (genesisSupply - minted).toString();

    document.getElementById("mintPrice").textContent =
        ethers.formatUnits(price, 18) + " USDC";
}

async function mint(quantity) {

    if (!signer) {
        await connectWallet();
        return;
    }

    if (quantity < 1 || quantity > 20) {
        alert("Choose between 1 and 20 Architects.");
        return;
    }

    const price = await contract.mintPrice();

    const total = price * BigInt(quantity);

    try {

        const tx = await contract.mint(quantity, {
            value: total
        });

        showStatus("Mint transaction submitted...");

        await tx.wait();

        showStatus("Architect minted successfully.");

        await updateStats();
        await loadCollection();

    } catch (error) {

        console.error(error);

        showStatus(
            error?.shortMessage ||
            error?.reason ||
            "Mint failed."
        );
    }
}

async function readNFT(tokenId) {

    try {

        const dna = await contract.getDNA(tokenId);

        const rarity =
            await contract.rarityScore(tokenId);

        const owner =
            await contract.ownerOf(tokenId);

        const uri =
            await contract.tokenURI(tokenId);

        return {
            tokenId,
            face: Number(dna.face),
            eyes: Number(dna.eyes),
            jaw: Number(dna.jaw),
            hair: Number(dna.hair),
            horns: Number(dna.horns),
            head: Number(dna.head),
            rarity: Number(rarity),
            owner,
            tokenURI: uri
        };

    } catch {
        return null;
    }
}
