<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ARC 360 — NFT Preview</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at top, #172033 0%, #080b12 45%, #030407 100%);
      color: #f2f4f8;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(5, 7, 12, 0.88);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 20px 30px;
    }

    .header-inner {
      max-width: 1500px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .network {
      font-size: 12px;
      color: #9aa4b5;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      max-width: 1500px;
      margin: auto;
      padding: 50px 25px 80px;
    }

    .hero {
      text-align: center;
      margin-bottom: 45px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 90px);
      letter-spacing: 8px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .hero p {
      color: #9da7b7;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .contract-box {
      max-width: 900px;
      margin: 0 auto 35px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      background: rgba(255,255,255,0.025);
      text-align: center;
      word-break: break-all;
    }

    .contract-label {
      font-size: 11px;
      color: #7f8999;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .contract-address {
      font-family: monospace;
      font-size: 13px;
      color: #dce2ec;
    }

    .status {
      max-width: 900px;
      margin: 0 auto 40px;
      padding: 18px 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }

    .status-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .status-text {
      color: #9ba5b5;
      font-size: 13px;
    }

    .progress-container {
      max-width: 900px;
      margin: 20px auto 45px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #9ba5b5;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      transition: width 0.2s ease;
    }

    .summary {
      display: flex;
      justify-content: center;
      gap: 35px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .summary-item {
      text-align: center;
      min-width: 110px;
    }

    .summary-number {
      font-size: 28px;
      font-weight: 900;
    }

    .summary-label {
      margin-top: 5px;
      color: #7f8999;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.055);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #07090e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .card-info {
      padding: 13px 14px 15px;
    }

    .card-number {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .card-name {
      color: #8993a3;
      font-size: 11px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-status {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 7px;
      border-radius: 5px;
      background: rgba(255,255,255,0.07);
      color: #aab3c1;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .error-card {
      padding: 25px;
      border: 1px solid rgba(255,70,70,0.25);
      background: rgba(255,50,50,0.04);
      border-radius: 12px;
      color: #ff9b9b;
      font-size: 12px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(12px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: min(900px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #090c13;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 25px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 20px;
      top: 15px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-image {
      width: 100%;
      max-width: 650px;
      margin: 0 auto 25px;
      display: block;
      background: #05070b;
      border-radius: 12px;
    }

    .modal-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .modal-description {
      color: #8f99a9;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .traits {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .trait {
      padding: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 9px;
    }

    .trait-type {
      color: #6f7888;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .trait-value {
      font-size: 12px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #505867;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 40px 20px;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px;
      }

      main {
        padding: 35px 12px 60px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card-info {
        padding: 10px;
      }

      .hero h1 {
        letter-spacing: 4px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">ARC 360</div>
    <div class="network">ARC TESTNET · NFT PREVIEW</div>
  </div>
</header>

<main>

  <section class="hero">
    <h1>ARC 360</h1>
    <p>ON-CHAIN ARCHITECTS · GENESIS PREVIEW</p>
  </section>

  <div class="contract-box">
    <div class="contract-label">Preview Contract</div>
    <div class="contract-address" id="contractAddress">
      0x48fad98b637d35c449819782b542af0306e4a56d
    </div>
  </div>

  <div class="status">
    <div class="status-title" id="statusTitle">
      Connecting to Arc Testnet...
    </div>

    <div class="status-text" id="statusText">
      Preparing on-chain preview.
    </div>
  </div>

  <div class="progress-container">

    <div class="progress-info">
      <span id="progressText">0 / 3600</span>
      <span id="progressPercent">0%</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

  </div>

  <div class="summary">

    <div class="summary-item">
      <div class="summary-number" id="totalCount">3600</div>
      <div class="summary-label">Total</div>
    </div>

    <div class="summary-item">
      <div class="summary-number" id="loadedCount">0</div>
      <div class="summary-label">Loaded</div>
    </div>

    <div class="summary-item">
      <div class="summary-number" id="errorCount">0</div>
      <div class="summary-label">Errors</div>
    </div>

  </div>

  <div class="gallery" id="gallery"></div>

</main>

<footer>
  ARC 360 · ON-CHAIN NFT PREVIEW · ARC TESTNET
</footer>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-content">

    <button class="close" onclick="closeModal()">×</button>

    <img
      id="modalImage"
      class="modal-image"
      src=""
      alt=""
    />

    <div class="modal-title" id="modalTitle"></div>

    <div class="modal-description" id="modalDescription"></div>

    <div class="traits" id="modalTraits"></div>

  </div>

</div>


<script>

  /*
   * ============================================================
   * ARC 360 — SIMPLE ON-CHAIN PREVIEW
   * ============================================================
   */

  const RPC_URL = "https://rpc.testnet.arc.network";

  const CONTRACT_ADDRESS =
    "0x48fad98b637d35c449819782b542af0306e4a56d";

  const TOTAL_NFTS = 3600;

  const ABI = [

    "function previewTokenURI(uint256 tokenId) view returns (string)",

    "function GENESIS_SUPPLY() view returns (uint256)"

  ];


  let provider;
  let contract;

  let loaded = 0;
  let errors = 0;


  /*
   * ------------------------------------------------------------
   * INITIALIZE
   * ------------------------------------------------------------
   */

  async function init() {

    try {

      setStatus(
        "Connecting to Arc Testnet...",
        "Connecting directly to the Arc Testnet RPC."
      );

      provider = new ethers.JsonRpcProvider(RPC_URL);

      contract = new ethers.Contract(
        CONTRACT_ADDRESS,
        ABI,
        provider
      );


      /*
       * Check contract
       */

      try {

        const supply = await contract.GENESIS_SUPPLY();

        console.log(
          "GENESIS_SUPPLY:",
          supply.toString()
        );

      } catch (e) {

        console.log(
          "GENESIS_SUPPLY unavailable. Using 3600."
        );

      }


      setStatus(
        "Contract connected",
        "Loading all 3,600 Architect previews directly from previewTokenURI()."
      );


      await loadAllNFTs();


      setStatus(
        "Preview complete",
        `${loaded} NFTs loaded successfully${errors > 0 ? ` · ${errors} errors` : ""}.`
      );

    } catch (error) {

      console.error(error);

      setStatus(
        "Connection error",
        error.message || "Could not connect to the contract."
      );

    }

  }


  /*
   * ------------------------------------------------------------
   * LOAD ALL NFTS
   * ------------------------------------------------------------
   */

  async function loadAllNFTs() {

    const gallery =
      document.getElementById("gallery");

    gallery.innerHTML = "";

    loaded = 0;
    errors = 0;

    updateProgress();


    /*
     * We load in batches so the RPC isn't hit
     * with 3,600 calls simultaneously.
     */

    const BATCH_SIZE = 12;


    for (
      let start = 1;
      start <= TOTAL_NFTS;
      start += BATCH_SIZE
    ) {

      const end = Math.min(
        start + BATCH_SIZE - 1,
        TOTAL_NFTS
      );


      const promises = [];


      for (
        let tokenId = start;
        tokenId <= end;
        tokenId++
      ) {

        promises.push(
          loadNFT(tokenId)
        );

      }


      await Promise.all(promises);


      updateProgress();

    }

  }


  /*
   * ------------------------------------------------------------
   * LOAD SINGLE NFT
   * ------------------------------------------------------------
   */

  async function loadNFT(tokenId) {

    try {

      /*
       * THIS IS THE IMPORTANT PART:
       *
       * We do NOT use tokenURI().
       *
       * We use previewTokenURI(), which allows us
       * to visualize NFTs that have not been minted yet.
       */

      const uri =
        await contract.previewTokenURI(tokenId);


      const metadata =
        decodeTokenURI(uri);


      addNFT(
        tokenId,
        metadata
      );


      loaded++;

    } catch (error) {

      console.error(
        `NFT #${tokenId} failed:`,
        error
      );

      errors++;

      addError(
        tokenId,
        error
      );

    }

  }


  /*
   * ------------------------------------------------------------
   * DECODE TOKEN URI
   * ------------------------------------------------------------
   */

  function decodeTokenURI(uri) {

    if (!uri) {

      throw new Error(
        "Empty token URI"
      );

    }


    /*
     * JSON BASE64
     */

    if (
      uri.startsWith(
        "data:application/json;base64,"
      )
    ) {

      const base64 =
        uri.split(",")[1];

      const json =
        decodeURIComponent(
          escape(
            atob(base64)
          )
        );

      return JSON.parse(json);

    }


    /*
     * Normal JSON data URI
     */

    if (
      uri.startsWith(
        "data:application/json,"
      )
    ) {

      const json =
        decodeURIComponent(
          uri.split(",")[1]
        );

      return JSON.parse(json);

    }


    /*
     * Sometimes metadata may be returned
     * directly as JSON.
     */

    if (
      uri.trim().startsWith("{")
    ) {

      return JSON.parse(uri);

    }


    throw new Error(
      "Unsupported metadata format"
    );

  }


  /*
   * ------------------------------------------------------------
   * ADD NFT CARD
   * ------------------------------------------------------------
   */

  function addNFT(tokenId, metadata) {

    const gallery =
      document.getElementById("gallery");


    const card =
      document.createElement("div");

    card.className = "card";


    const image =
      metadata.image || "";


    const name =
      metadata.name ||
      `ARC 360 #${formatId(tokenId)}`;


    card.innerHTML = `

      <div class="card-image">

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(name)}"
          loading="lazy"
        />

      </div>

      <div class="card-info">

        <div class="card-number">
          #${formatId(tokenId)}
        </div>

        <div class="card-name">
          ${escapeHtml(name)}
        </div>

        <div class="card-status">
          ON-CHAIN PREVIEW
        </div>

      </div>

    `;


    card.addEventListener(
      "click",
      () => openModal(
        tokenId,
        metadata
      )
    );


    gallery.appendChild(card);

  }


  /*
   * ------------------------------------------------------------
   * ERROR CARD
   * ------------------------------------------------------------
   */

  function addError(tokenId, error) {

    const gallery =
      document.getElementById("gallery");


    const card =
      document.createElement("div");

    card.className =
      "error-card";


    card.innerHTML = `

      <strong>
        #${formatId(tokenId)}
      </strong>

      <br><br>

      Failed to load preview.

    `;


    gallery.appendChild(card);

  }


  /*
   * ------------------------------------------------------------
   * MODAL
   * ------------------------------------------------------------
   */

  function openModal(
    tokenId,
    metadata
  ) {

    const modal =
      document.getElementById("modal");


    const image =
      document.getElementById("modalImage");


    const title =
      document.getElementById("modalTitle");


    const description =
      document.getElementById("modalDescription");


    const traits =
      document.getElementById("modalTraits");


    image.src =
      metadata.image || "";


    image.alt =
      metadata.name ||
      `ARC 360 #${formatId(tokenId)}`;


    title.textContent =
      metadata.name ||
      `ARC 360 #${formatId(tokenId)}`;


    description.textContent =
      metadata.description ||
      `ARC 360 Architect #${formatId(tokenId)} — on-chain preview.`;


    traits.innerHTML = "";


    if (
      Array.isArray(
        metadata.attributes
      )
    ) {

      metadata.attributes.forEach(
        attribute => {

          const trait =
            document.createElement("div");

          trait.className =
            "trait";


          const type =
            attribute.trait_type ||
            "Trait";


          const value =
            attribute.value ??
            "";


          trait.innerHTML = `

            <div class="trait-type">
              ${escapeHtml(type)}
            </div>

            <div class="trait-value">
              ${escapeHtml(String(value))}
            </div>

          `;


          traits.appendChild(trait);

        }
      );

    }


    modal.classList.add(
      "active"
    );

  }


  function closeModal() {

    document
      .getElementById("modal")
      .classList.remove("active");

  }


  document
    .getElementById("modal")
    .addEventListener(
      "click",
      event => {

        if (
          event.target.id === "modal"
        ) {

          closeModal();

        }

      }
    );


  /*
   * ------------------------------------------------------------
   * STATUS
   * ------------------------------------------------------------
   */

  function setStatus(
    title,
    text
  ) {

    document
      .getElementById("statusTitle")
      .textContent = title;


    document
      .getElementById("statusText")
      .textContent = text;

  }


  /*
   * ------------------------------------------------------------
   * PROGRESS
   * ------------------------------------------------------------
   */

  function updateProgress() {

    const percent =
      Math.round(
        (loaded + errors) /
        TOTAL_NFTS *
        100
      );


    document
      .getElementById("progressText")
      .textContent =
        `${loaded + errors} / ${TOTAL_NFTS}`;


    document
      .getElementById("progressPercent")
      .textContent =
        `${percent}%`;


    document
      .getElementById("progressFill")
      .style.width =
        `${percent}%`;


    document
      .getElementById("loadedCount")
      .textContent =
        loaded;


    document
      .getElementById("errorCount")
      .textContent =
        errors;

  }


  /*
   * ------------------------------------------------------------
   * FORMAT ID
   * ------------------------------------------------------------
   */

  function formatId(id) {

    return String(id)
      .padStart(4, "0");

  }


  /*
   * ------------------------------------------------------------
   * HTML ESCAPE
   * ------------------------------------------------------------
   */

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
   * START
   */

  init();

</script>

</body>
</html>
