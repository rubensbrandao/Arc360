<!DOCTYPE html>

========================= */

<script type="module">

import {
  BrowserProvider,
  JsonRpcProvider,
  Contract
} from "https://cdn.jsdelivr.net/npm/ethers@6.15.0/+esm";

/* =========================================================
   CONFIG
========================================================= */

const RPC_URL =
  "https://rpc.testnet.arc.network";

const CHAIN_ID =
  5042002;

const CHAIN_ID_HEX =
  "0x4cef52";

const CONTRACT_ADDRESS =
  "0x1aa4e3d6765ad2a0244b69681a34e48779dc8d65";

const EXPLORER =
  "https://explorer.testnet.arc.io/address/" +
  CONTRACT_ADDRESS;

const TOTAL_SUPPLY =
  3600;

const PAGE_SIZE_DEFAULT =
  24;

const BATCH_SIZE =
  4;

const MAX_RETRIES =
  5;

/* =========================================================
   ABI
========================================================= */

const ABI = [

  "function previewTokenURI(uint256 tokenId) view returns (string)",

  "function isGenesisMinted(uint256 tokenId) view returns (bool)",

  "function rarityScore(uint256 tokenId) view returns (uint256)",

  "function getDNA(uint256 tokenId) view returns (uint256 face,uint256 eyes,uint256 jaw,uint256 hair,uint256 horns,uint256 head)",

  "function mint(uint256[] tokenIds) payable",

  "function mintPrice() view returns (uint256)",

  "function genesisMinted() view returns (uint256)",

  "function activeSupply() view returns (uint256)"
];

/* =========================================================
   PROVIDERS
========================================================= */

const readProvider =
  new JsonRpcProvider(RPC_URL);

const readContract =
  new Contract(
    CONTRACT_ADDRESS,
    ABI,
    readProvider
  );

let browserProvider = null;
let signer = null;
let writeContract = null;
let walletAddress = null;

/* =========================================================
   STATE
========================================================= */

let allNFTs = [];

let filteredNFTs = [];

let currentPage = 1;

let pageSize = PAGE_SIZE_DEFAULT;

let currentDetail = null;

let mintPrice = 0n;

/* =========================================================
   DOM
========================================================= */

const gallery =
  document.getElementById("gallery");

const loading =
  document.getElementById("loading");

const count =
  document.getElementById("count");

const search =
  document.getElementById("search");

const sort =
  document.getElementById("sort");

const statusFilter =
  document.getElementById("statusFilter");

const pageSizeSelect =
  document.getElementById("pageSize");

const pagination =
  document.getElementById("pagination");

const walletButton =
  document.getElementById("walletButton");

const overlay =
  document.getElementById("overlay");

const closeDetail =
  document.getElementById("closeDetail");

const detailImage =
  document.getElementById("detailImage");

const detailName =
  document.getElementById("detailName");

const detailPrice =
  document.getElementById("detailPrice");

const detailStatus =
  document.getElementById("detailStatus");

const traits =
  document.getElementById("traits");

const detailMint =
  document.getElementById("detailMint");

const toast =
  document.getElementById("toast");

/* =========================================================
   HELPERS
========================================================= */

function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {
      toast.classList.remove("show");
    }, 4500);
}

function shortenAddress(address){

  if(!address) return "";

  return (
    address.slice(0,6) +
    "..." +
    address.slice(-4)
  );
}

function formatPrice(value){

  if(value === 0n){
    return "FREE";
  }

  try{

    const amount =
      Number(value) / 1e18;

    return amount + " ARC";

  }catch{

    return value.toString() + " wei";

  }
}

function sleep(ms){

  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}

/* =========================================================
   RPC RETRY
========================================================= */

async function retryCall(fn){

  let lastError = null;

  for(
    let attempt = 1;
    attempt <= MAX_RETRIES;
    attempt++
  ){

    try{

      return await fn();

    }catch(error){

      lastError = error;

      console.warn(
        "RPC attempt",
        attempt,
        error
      );

      if(attempt < MAX_RETRIES){

        await sleep(
          500 * attempt
        );

      }

    }

  }

  throw lastError;
}

/* =========================================================
   TOKEN URI
========================================================= */

function decodeTokenURI(uri){

  try{

    const prefix =
      "data:application/json;base64,";

    if(!uri.startsWith(prefix)){
      throw new Error(
        "Unexpected tokenURI format"
      );
    }

    const base64 =
      uri.slice(prefix.length);

    const json =
      decodeURIComponent(
        Array.prototype.map.call(
          atob(base64),
          c =>
            "%" +
            ("00"+c.charCodeAt(0).toString(16))
              .slice(-2)
        ).join("")
      );

    return JSON.parse(json);

  }catch(error){

    console.error(
      "Metadata decode failed:",
      error
    );

    return null;
  }
}

/* =========================================================
   NFT LOAD
========================================================= */

async function loadNFT(id){

  const minted =
    await retryCall(() =>
      readContract.isGenesisMinted(id)
    );

  const rarity =
    await retryCall(() =>
      readContract.rarityScore(id)
    );

  const uri =
    await retryCall(() =>
      readContract.previewTokenURI(id)
    );

  const metadata =
    decodeTokenURI(uri);

  let image = "";

  if(metadata && metadata.image){

    image =
      metadata.image;

  }

  return {

    id,

    minted,

    rarity:
      Number(rarity),

    image,

    price:
      mintPrice

  };
}

/* =========================================================
   LOAD ALL NFTs
========================================================= */

async function loadCollection(){

  loading.style.display =
    "flex";

  gallery.innerHTML =
    "";

  count.textContent =
    "Loading...";

  try{

    mintPrice =
      await retryCall(() =>
        readContract.mintPrice()
      );

    console.log(
      "Contract:",
      CONTRACT_ADDRESS
    );

    console.log(
      "Mint price:",
      mintPrice.toString()
    );

    allNFTs = [];

    /*
      We load in very small batches.
      This avoids flooding the Arc RPC.
    */

    for(
      let start = 1;
      start <= TOTAL_SUPPLY;
      start += BATCH_SIZE
    ){

      const end =
        Math.min(
          start + BATCH_SIZE - 1,
          TOTAL_SUPPLY
        );

      const batch = [];

      for(
        let id = start;
        id <= end;
        id++
      ){

        batch.push(
          loadNFT(id)
        );

      }

      const results =
        await Promise.all(batch);

      allNFTs.push(
        ...results
      );

      count.textContent =
        `${allNFTs.length.toLocaleString()} / ${TOTAL_SUPPLY.toLocaleString()}`;

      /*
        Render progressively so the page
        starts showing NFTs immediately.
      */

      applyFilters();

      await sleep(80);
    }

    loading.style.display =
      "none";

    count.textContent =
      `${allNFTs.length.toLocaleString()} NFTs`;

    applyFilters();

  }catch(error){

    console.error(error);

    loading.style.display =
      "none";

    gallery.innerHTML = `
      <div class="error-box" style="grid-column:1/-1">
        <strong>Unable to load the collection.</strong>
        <br><br>
        The Arc Testnet RPC may have temporarily
        rejected a request.
        <br><br>
        Please refresh the page and try again.
      </div>
    `;

    count.textContent =
      "RPC ERROR";

  }

}

/* =========================================================
   FILTERS
========================================================= */

function applyFilters(){

  const query =
    search.value
      .trim()
      .toLowerCase();

  const status =
    statusFilter.value;

  filteredNFTs =
    allNFTs.filter(nft => {

      const matchesSearch =
        !query ||
        String(nft.id)
          .includes(
            query.replace(
              "arc 360 #",
              ""
            )
          );

      const matchesStatus =
        status === "all" ||
        (
          status === "available" &&
          !nft.minted
        ) ||
        (
          status === "minted" &&
          nft.minted
        );

      return (
        matchesSearch &&
        matchesStatus
      );

    });

  const sortMode =
    sort.value;

  filteredNFTs.sort(
    (a,b) => {

      if(sortMode === "id-asc"){
        return a.id - b.id;
      }

      if(sortMode === "id-desc"){
        return b.id - a.id;
      }

      if(sortMode === "rarity-asc"){
        return a.rarity - b.rarity;
      }

      if(sortMode === "rarity-desc"){
        return b.rarity - a.rarity;
      }

      return 0;
    }
  );

  currentPage = 1;

  renderPage();

}

/* =========================================================
   IMAGE
========================================================= */

function imageHTML(nft){

  if(!nft.image){

    return `

/* =========================================================
   RENDER PAGE
========================================================= */

function renderPage(){

  const total =
    filteredNFTs.length;

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        total / pageSize
      )
    );

  if(currentPage > totalPages){
    currentPage =
      totalPages;
  }

  const start =
    (currentPage - 1) *
    pageSize;

  const end =
    start + pageSize;

  const pageNFTs =
    filteredNFTs.slice(
      start,
      end
    );

  if(pageNFTs.length === 0){

    gallery.innerHTML = `
      <div class="error-box"
        style="grid-column:1/-1">
        No NFTs found.
      </div>
    `;

  }else{

    gallery.innerHTML =
      pageNFTs
        .map(renderCard)
        .join("");

  }

  renderPagination(
    totalPages
  );

  /*
    Attach click handlers after
    cards are rendered.
  */

  document
    .querySelectorAll("[data-open]")
    .forEach(el => {

      el.addEventListener(
        "click",
        () => {

          const id =
            Number(
              el.dataset.open
            );

          openDetail(id);

        }
      );

    });

  document
    .querySelectorAll("[data-detail]")
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          const id =
            Number(
              button.dataset.detail
            );

          openDetail(id);

        }
      );

    });

}

/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(totalPages){

  pagination.innerHTML =
    "";

  if(totalPages <= 1){
    return;
  }

  const prev =
    document.createElement("button");

  prev.className =
    "page-button";

  prev.textContent =
    "←";

  prev.disabled =
    currentPage === 1;

  prev.onclick =
    () => {

      if(currentPage > 1){

        currentPage--;

        renderPage();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }

    };

  pagination.appendChild(prev);

  /*
    Show a compact page range.
  */

  let start =
    Math.max(
      1,
      currentPage - 2
    );

  let end =
    Math.min(
      totalPages,
      currentPage + 2
    );

  if(currentPage <= 3){
    end =
      Math.min(
        totalPages,
        5
      );
  }

  if(currentPage >= totalPages - 2){
    start =
      Math.max(
        1,
        totalPages - 4
      );
  }

  for(
    let page = start;
    page <= end;
    page++
  ){

    const button =
      document.createElement("button");

    button.className =
      "page-button" +
      (
        page === currentPage
          ? " active"
          : ""
      );

    button.textContent =
      page;

    button.onclick =
      () => {

        currentPage =
          page;

        renderPage();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      };

    pagination.appendChild(
      button
    );

  }

  const next =
    document.createElement("button");

  next.className =
    "page-button";

  next.textContent =
    "→";

  next.disabled =
    currentPage === totalPages;

  next.onclick =
    () => {

      if(
        currentPage <
        totalPages
      ){

        currentPage++;

        renderPage();

        window.scrollTo({
          top:0,
          behavior:"smooth"
        });

      }

    };

  pagination.appendChild(next);

  const info =
    document.createElement("span");

  info.className =
    "page-info";

  info.textContent =
    `${currentPage} / ${totalPages}`;

  pagination.appendChild(info);

}

/* =========================================================
   WALLET
========================================================= */

async function connectWallet(){

  if(!window.ethereum){

    showToast(
      "MetaMask was not detected."
    );

    return;

  }

  try{

    browserProvider =
      new BrowserProvider(
        window.ethereum
      );

    /*
      Request wallet permission.
    */

    await browserProvider.send(
      "eth_requestAccounts",
      []
    );

    /*
      Switch to Arc Testnet.
    */

    try{

      await window.ethereum.request({
        method:"wallet_switchEthereumChain",
        params:[
          {
            chainId:
              CHAIN_ID_HEX
          }
        ]
      });

    }catch(error){

      /*
        4902 = chain not added.
      */

      if(error.code === 4902){

        await window.ethereum.request({
          method:"wallet_addEthereumChain",
          params:[
            {
              chainId:
                CHAIN_ID_HEX,

              chainName:
                "Arc Testnet",

              nativeCurrency:{
                name:"USDC",
                symbol:"USDC",
                decimals:18
              },

              rpcUrls:[
                RPC_URL
              ],

              blockExplorerUrls:[
                "https://explorer.testnet.arc.io"
              ]
            }
          ]
        });

      }else{

        throw error;

      }

    }

    browserProvider =
      new BrowserProvider(
        window.ethereum
      );

    signer =
      await browserProvider.getSigner();

    walletAddress =
      await signer.getAddress();

    writeContract =
      new Contract(
        CONTRACT_ADDRESS,
        ABI,
        signer
      );

    walletButton.textContent =
      shortenAddress(
        walletAddress
      );

    showToast(
      "Wallet connected: " +
      shortenAddress(walletAddress)
    );

  }catch(error){

    console.error(
      "Wallet connection error:",
      error
    );

    showToast(
      getReadableError(error)
    );

  }

}

/* =========================================================
   ERROR MESSAGE
========================================================= */

function getReadableError(error){

  if(!error){
    return "Unknown error.";
  }

  if(
    error.code === 4001 ||
    error.code === "ACTION_REJECTED"
  ){
    return "Transaction rejected in wallet.";
  }

  if(
    error.message &&
    error.message.includes(
      "insufficient funds"
    )
  ){
    return "Insufficient funds.";
  }

  if(
    error.reason
  ){
    return error.reason;
  }

  if(
    error.shortMessage
  ){
    return error.shortMessage;
  }

  if(
    error.message
  ){

    return error.message
      .replace(
        /\s+/g,
        " "
      )
      .slice(0,300);

  }

  return "Transaction failed.";

}
